name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Copy to deploy path
        shell: powershell
        run: |
          if (!(Test-Path "D:\mobile_netra")) {
            New-Item -ItemType Directory -Force "D:\mobile_netra"
          }
          Copy-Item -Recurse -Force "${{ github.workspace }}\*" "D:\mobile_netra\"

      - name: Install dependencies
        working-directory: D:\mobile_netra
        shell: powershell
        run: npm ci

      - name: Build
        working-directory: D:\mobile_netra
        shell: powershell
        run: npm run build

      - name: PM2 restart
        working-directory: D:\mobile_netra
        shell: cmd
        run: |
          pm2 restart mobile-netra || pm2 start ecosystem.config.js
          pm2 save
