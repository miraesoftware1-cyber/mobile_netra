name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code
        shell: cmd
        run: |
          if not exist D:\mobile_netra mkdir D:\mobile_netra
          git config --global --add safe.directory D:/mobile_netra
          git -C D:\mobile_netra init
          git -C D:\mobile_netra remote remove origin 2>nul & echo .
          git -C D:\mobile_netra remote add origin http://211.56.248.9:3000/miraesoftware/mobile_netra-test-.git
          git -C D:\mobile_netra -c http.extraHeader="Authorization: token ${{ secrets.DEPLOY_TOKEN }}" fetch origin
          git -C D:\mobile_netra reset --hard origin/main

      - name: Stop app
        shell: cmd
        run: pm2 stop mobile-netra 2>nul & echo done

      - name: Install dependencies
        working-directory: D:\mobile_netra
        shell: cmd
        run: npm ci

      - name: Build
        working-directory: D:\mobile_netra
        shell: cmd
        run: |
          rmdir /s /q .next 2>nul & echo cache cleared
          npm run build

      - name: Start app
        shell: cmd
        run: pm2 restart mobile-netra 2>nul || pm2 start D:\mobile_netra\ecosystem.config.js
