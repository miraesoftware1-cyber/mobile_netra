name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code
        shell: cmd
        run: |
          git config --global --add safe.directory D:/mobile_netra
          git config --global credential.helper ""
          if not exist D:\mobile_netra\.git (
            git -c credential.helper= clone http://pmk:5bf62dc71c1710868e7932cd78d790fac7b6140c@211.56.248.9:3000/miraesoftware/mobile_netra-test-.git D:\mobile_netra
          ) else (
            git -C D:\mobile_netra -c credential.helper= fetch http://pmk:5bf62dc71c1710868e7932cd78d790fac7b6140c@211.56.248.9:3000/miraesoftware/mobile_netra-test-.git && git -C D:\mobile_netra reset --hard origin/main
          )

      - name: Stop PM2
        shell: cmd
        run: pm2 stop mobile-netra 2>nul & exit 0

      - name: Install dependencies
        working-directory: D:\mobile_netra
        shell: cmd
        run: npm ci

      - name: Build
        working-directory: D:\mobile_netra
        shell: cmd
        run: npm run build

      - name: PM2 restart
        working-directory: D:\mobile_netra
        shell: cmd
        run: |
          pm2 restart mobile-netra || pm2 start ecosystem.config.js
          pm2 save
