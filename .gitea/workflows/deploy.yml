name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: PM2 restart
        run: |
          $status = pm2 describe mobile-netra 2>&1
          if ($LASTEXITCODE -eq 0) {
            pm2 restart mobile-netra
          } else {
            pm2 start npm --name "mobile-netra" -- run start -- --port 3001
          }
          pm2 save
