name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code
        shell: cmd
        run: |
          if not exist D:\mobile_netra mkdir D:\mobile_netra
          git config --global --add safe.directory D:/mobile_netra
          git -C D:\mobile_netra init
          git -C D:\mobile_netra remote remove origin 2>nul & echo .
          git -C D:\mobile_netra remote add origin http://211.56.248.9:3000/miraesoftware/mobile_netra-test-.git
          git -C D:\mobile_netra -c http.extraHeader="Authorization: token ${{ secrets.DEPLOY_TOKEN }}" fetch origin
          git -C D:\mobile_netra reset --hard origin/main

      - name: Stop app
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $lines = netstat -ano | Select-String "0\.0\.0\.0:3001\s.*LISTENING|:::3001\s.*LISTENING"
          foreach ($line in $lines) {
            $parts = $line.Line.Trim() -split '\s+'
            $procId = $parts[-1]
            if ($procId -match '^\d+$') {
              Write-Host "Killing PID $procId on port 3001"
              taskkill /F /PID $procId 2>$null
            }
          }
          Start-Sleep -Seconds 2
          Write-Host "done"
          exit 0

      - name: Install dependencies
        working-directory: D:\mobile_netra
        shell: cmd
        run: npm ci

      - name: Build
        working-directory: D:\mobile_netra
        shell: cmd
        run: |
          rmdir /s /q .next 2>nul & echo cache cleared
          npm run build

      - name: Start app
        shell: powershell
        run: |
          $logOut = "D:\mobile_netra\next-out.log"
          $logErr = "D:\mobile_netra\next-err.log"
          Start-Process -FilePath "node" `
            -ArgumentList "node_modules/.bin/next","start","-p","3001" `
            -WorkingDirectory "D:\mobile_netra" `
            -RedirectStandardOutput $logOut `
            -RedirectStandardError $logErr `
            -NoNewWindow
          Start-Sleep -Seconds 4
          $running = netstat -ano | Select-String ":3001.*LISTENING"
          if ($running) {
            Write-Host "App started successfully on port 3001"
          } else {
            Write-Host "WARNING: port 3001 not detected yet"
          }
